<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreatorGig — Pro Creator Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialGigs = [
      { id: 1, title: 'Custom Twitch & Discord Emote Pack', category: 'Design', rate: 50, author: 'PixelPro', description: 'Hand-drawn, custom animated emotes tailored to your stream personality and brand identity.', status: 'Active' },
      { id: 2, title: 'Podcast Audio Editing & Mixing', category: 'Audio', rate: 120, author: 'SoundWave', description: 'Professional audio cleanup, background noise removal, leveling, and studio master balancing.', status: 'Active' },
      { id: 3, title: 'SEO Blog Posts & Content Writing', category: 'Writing', rate: 80, author: 'WordSmith', description: 'High-converting 1,000-word articles tailored for modern audience engagement and ranking.', status: 'Active' }
    ];

    const initialBookings = [
      { id: 101, gigId: 1, gigTitle: 'Custom Twitch & Discord Emote Pack', clientName: 'Alex Rivera', clientEmail: 'alex@example.com', creatorName: 'PixelPro', rate: 50, status: 'Pending', notes: 'Need 3 custom emotes for my channel launch next week.' },
      { id: 102, gigId: 2, gigTitle: 'Podcast Audio Editing & Mixing', clientName: 'Jordan Lee', clientEmail: 'jordan@example.com', creatorName: 'SoundWave', rate: 120, status: 'Accepted', notes: 'Episode 14 raw track files linked in drive folder.' }
    ];

    const initialUserProfile = {
      name: 'PixelPro',
      email: 'pixelpro@example.com',
      avatarUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80'
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('marketplace');
      const [gigs, setGigs] = useState(initialGigs);
      const [bookings, setBookings] = useState(initialBookings);
      const [profile, setProfile] = useState(initialUserProfile);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [sortBy, setSortBy] = useState('newest');

      const [selectedGigForBooking, setSelectedGigForBooking] = useState(null);
      const [preventDoubleBooking, setPreventDoubleBooking] = useState(false);

      const [profileForm, setProfileForm] = useState(initialUserProfile);
      const [profileSaved, setProfileSaved] = useState(false);

      useEffect(() => {
        setProfileForm(profile);
      }, [profile]);

      const handleCreateGig = (newGig) => {
        setGigs([{ ...newGig, id: Date.now(), status: 'Active' }, ...gigs]);
        setCurrentTab('marketplace');
      };

      const handleBookGig = (bookingData) => {
        const newBooking = {
          id: Date.now(),
          gigId: selectedGigForBooking.id,
          gigTitle: selectedGigForBooking.title,
          creatorName: selectedGigForBooking.author,
          rate: selectedGigForBooking.rate,
          status: 'Pending',
          ...bookingData
        };
        setBookings([newBooking, ...bookings]);
        setSelectedGigForBooking(null);
        setCurrentTab('client-bookings');
      };

      const handleBookingStatus = (bookingId, status) => {
        setBookings(bookings.map(b => b.id === bookingId ? { ...b, status } : b));
      };

      const handleGalleryImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = 250;
              canvas.height = 250;
              ctx.drawImage(img, 0, 0, 250, 250);
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.90);
              setProfileForm(prev => ({ ...prev, avatarUrl: compressedBase64 }));
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handleUpdateProfile = (e) => {
        e.preventDefault();
        setProfile({ ...profileForm });
        setProfileSaved(true);
        setTimeout(() => setProfileSaved(false), 3000);
      };

      const categories = ['All', 'Design', 'Audio', 'Writing', 'Video'];
      const filteredGigs = gigs
        .filter(gig => {
          const matchesSearch = gig.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                gig.description.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = selectedCategory === 'All' || gig.category === selectedCategory;
          const hasPendingBooking = bookings.some(b => b.gigId === gig.id && b.status === 'Pending');
          const isAvailable = !preventDoubleBooking || !hasPendingBooking;

          return matchesSearch && matchesCategory && isAvailable;
        })
        .sort((a, b) => {
          if (sortBy === 'cheapest') return a.rate - b.rate;
          if (sortBy === 'expensive') return b.rate - a.rate;
          return b.id - a.id;
        });

      const creatorSpecificBookings = bookings.filter(b => b.creatorName === profile.name || b.creatorName === 'PixelPro');

      return (
        <div className="flex flex-col min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950">
          
          {/* Navigation Bar */}
          <nav className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setCurrentTab('marketplace')}>
                <div className="w-9 h-9 bg-gradient-to-tr from-indigo-500 to-violet-500 text-white rounded-xl flex items-center justify-center font-black text-lg shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
                  C
                </div>
                <span className="font-bold text-xl text-white tracking-tight">Creator<span className="text-indigo-400">Gig</span></span>
              </div>
              
              <div className="flex items-center space-x-1 sm:space-x-2">
                {[
                  { id: 'marketplace', label: 'Marketplace' },
                  { id: 'post', label: 'Post Gig' },
                  { id: 'creator-dashboard', label: 'Dashboard' },
                  { id: 'client-bookings', label: 'Bookings' }
                ].map(tab => (
                  <button 
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)} 
                    className={`px-3.5 py-2 text-xs font-semibold rounded-lg transition-all ${
                      currentTab === tab.id 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                        : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}

                {/* Profile Pill */}
                <button 
                  onClick={() => setCurrentTab('profile')}
                  className={`flex items-center space-x-2 pl-1.5 pr-3 py-1 rounded-full border transition-all ${
                    currentTab === 'profile' 
                      ? 'border-indigo-500 bg-indigo-500/10 text-white' 
                      : 'border-slate-800 bg-slate-900/50 text-slate-300 hover:border-slate-700 hover:bg-slate-800'
                  }`}
                >
                  <img 
                    src={profile.avatarUrl} 
                    alt={profile.name} 
                    className="w-7 h-7 rounded-full object-cover ring-2 ring-indigo-500/50"
                  />
                  <span className="text-xs font-semibold hidden sm:inline">{profile.name}</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Main Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            
            {/* VIEW 1: BROWSE MARKETPLACE */}
            {currentTab === 'marketplace' && (
              <div>
                <header className="mb-8 text-center sm:text-left">
                  <span className="text-xs font-semibold uppercase tracking-widest text-indigo-400">Direct Services</span>
                  <h1 className="text-3xl font-extrabold text-white mt-1 tracking-tight">Explore Services</h1>
                  <p className="text-slate-400 text-sm mt-1">Book creative talent and digital services seamlessly.</p>
                </header>

                {/* Filter & Controls Bar */}
                <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl mb-6 flex flex-wrap gap-4 items-center justify-between backdrop-blur-sm">
                  <div className="flex items-center space-x-2 text-xs text-slate-300">
                    <input 
                      type="checkbox" 
                      id="preventDouble" 
                      checked={preventDoubleBooking} 
                      onChange={(e) => setPreventDoubleBooking(e.target.checked)}
                      className="rounded border-slate-700 bg-slate-950 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer w-4 h-4"
                    />
                    <label htmlFor="preventDouble" className="cursor-pointer font-medium">
                      Hide Gigs with Active Pending Requests
                    </label>
                  </div>
                  
                  <div className="flex items-center space-x-2 text-xs">
                    <span className="text-slate-400 font-medium">Sort By:</span>
                    <select 
                      value={sortBy} 
                      onChange={(e) => setSortBy(e.target.value)}
                      className="border border-slate-700 rounded-lg px-2.5 py-1.5 bg-slate-950 text-slate-200 focus:border-indigo-500 focus:outline-none"
                    >
                      <option value="newest">Newest Listed</option>
                      <option value="cheapest">Price: Low to High</option>
                      <option value="expensive">Price: High to Low</option>
                    </select>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row gap-6">
                  {/* Category Filter Sidebar */}
                  <aside className="w-full md:w-56 space-y-4">
                    <input 
                      type="text" 
                      placeholder="Search title or tags..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl bg-slate-900/90 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 focus:outline-none text-xs"
                    />

                    <div className="bg-slate-900/60 border border-slate-800/80 p-3.5 rounded-2xl backdrop-blur-sm">
                      <h3 className="font-semibold text-slate-300 text-xs uppercase tracking-wider mb-2.5 px-2">Categories</h3>
                      <div className="space-y-1">
                        {categories.map(cat => (
                          <button 
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition-all ${
                              selectedCategory === cat 
                                ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30' 
                                : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    </div>
                  </aside>

                  {/* Grid Cards */}
                  <section className="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredGigs.length === 0 ? (
                      <div className="col-span-full bg-slate-900/40 border border-dashed border-slate-800 p-12 text-center rounded-2xl text-slate-500 text-sm">
                        No active creator gigs match your filter criteria.
                      </div>
                    ) : (
                      filteredGigs.map(gig => (
                        <div key={gig.id} className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl flex flex-col justify-between hover:border-slate-700 hover:shadow-xl hover:shadow-indigo-500/5 transition-all group">
                          <div>
                            <div className="flex justify-between items-start mb-3">
                              <span className="text-[10px] font-bold uppercase tracking-wider bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-full">{gig.category}</span>
                              <span className="text-xs text-slate-400">by <strong className="text-slate-200">{gig.author}</strong></span>
                            </div>
                            <h3 className="font-bold text-white text-base leading-snug group-hover:text-indigo-300 transition-colors">{gig.title}</h3>
                            <p className="text-slate-400 text-xs mt-2 line-clamp-3 leading-relaxed">{gig.description}</p>
                          </div>
                          <div className="mt-5 pt-3.5 border-t border-slate-800/80 flex justify-between items-center">
                            <div>
                              <span className="text-xs text-slate-500 block font-medium">Starting at</span>
                              <span className="text-xl font-black text-white">${gig.rate}</span>
                            </div>
                            <button 
                              onClick={() => setSelectedGigForBooking(gig)}
                              className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-xs shadow-md shadow-indigo-600/20 transition-all hover:scale-[1.02]"
                            >
                              Book Service
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </section>
                </div>
              </div>
            )}

            {/* VIEW 2: POST A GIG */}
            {currentTab === 'post' && (
              <div className="max-w-xl mx-auto bg-slate-900/60 border border-slate-800/80 p-6 sm:p-8 rounded-2xl shadow-xl backdrop-blur-sm">
                <header className="mb-6">
                  <h1 className="text-2xl font-bold text-white">Create a New Gig</h1>
                  <p className="text-slate-400 text-xs mt-1">Offer your skills and services to clients on the platform.</p>
                </header>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  handleCreateGig({
                    title: formData.get('title'),
                    category: formData.get('category'),
                    rate: Number(formData.get('rate')),
                    author: profile.name,
                    description: formData.get('description')
                  });
                }} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Creator Handle</label>
                    <input name="author" value={profile.name} disabled readOnly type="text" className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950/60 text-slate-500" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Gig Title</label>
                    <input name="title" required type="text" placeholder="e.g. Minimalist Brand Logo & Identity Design" className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Category</label>
                      <select name="category" className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white focus:border-indigo-500 focus:outline-none">
                        <option value="Design">Design</option>
                        <option value="Audio">Audio</option>
                        <option value="Writing">Writing</option>
                        <option value="Video">Video</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Fixed Rate ($ USD)</label>
                      <input name="rate" required type="number" min="1" placeholder="75" className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Service Scope & Description</label>
                    <textarea name="description" required rows="4" placeholder="Detail deliverables, revision terms, and timelines..." className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none"></textarea>
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all text-xs shadow-lg shadow-indigo-600/25 mt-2">
                    Publish Gig
                  </button>
                </form>
              </div>
            )}

            {/* VIEW 3: CREATOR DASHBOARD */}
            {currentTab === 'creator-dashboard' && (
              <div>
                <header className="mb-6">
                  <h1 className="text-2xl font-bold text-white">Creator Requests</h1>
                  <p className="text-slate-400 text-xs mt-1">Manage client orders submitted to <strong>{profile.name}</strong>.</p>
                </header>

                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl overflow-hidden backdrop-blur-sm">
                  {creatorSpecificBookings.length === 0 ? (
                    <div className="p-12 text-center text-slate-500 text-sm">No incoming booking requests found for your account.</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-slate-950/80 text-slate-400 text-[10px] uppercase font-bold tracking-wider border-b border-slate-800">
                            <th className="p-4">Gig Title</th>
                            <th className="p-4">Client Contact</th>
                            <th className="p-4">Instructions</th>
                            <th className="p-4">Quoted</th>
                            <th className="p-4">Status</th>
                            <th className="p-4 text-right">Decision</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60 text-xs">
                          {creatorSpecificBookings.map(b => (
                            <tr key={b.id} className="hover:bg-slate-800/30 transition-colors">
                              <td className="p-4 font-semibold text-white">{b.gigTitle}</td>
                              <td className="p-4">
                                <div className="font-medium text-slate-200">{b.clientName}</div>
                                <div className="text-[11px] text-slate-500">{b.clientEmail}</div>
                              </td>
                              <td className="p-4 text-slate-400 max-w-xs truncate">{b.notes || 'No custom notes.'}</td>
                              <td className="p-4 font-bold text-white">${b.rate}</td>
                              <td className="p-4">
                                <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${
                                  b.status === 'Accepted' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                  b.status === 'Declined' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' :
                                  'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                                }`}>
                                  {b.status}
                                </span>
                              </td>
                              <td className="p-4 text-right space-x-2">
                                {b.status === 'Pending' ? (
                                  <>
                                    <button 
                                      onClick={() => handleBookingStatus(b.id, 'Accepted')}
                                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition-all"
                                    >
                                      Accept
                                    </button>
                                    <button 
                                      onClick={() => handleBookingStatus(b.id, 'Declined')}
                                      className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold transition-all"
                                    >
                                      Decline
                                    </button>
                                  </>
                                ) : (
                                  <span className="text-[11px] text-slate-500 font-medium">Archived</span>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 4: MY BOOKINGS (CLIENT) */}
            {currentTab === 'client-bookings' && (
              <div>
                <header className="mb-6">
                  <h1 className="text-2xl font-bold text-white">My Orders</h1>
                  <p className="text-slate-400 text-xs mt-1">Track updates on your requested creator services.</p>
                </header>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {bookings.map(b => (
                    <div key={b.id} className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl backdrop-blur-sm flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start mb-2">
                          <h3 className="font-bold text-white text-sm">{b.gigTitle}</h3>
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${
                            b.status === 'Accepted' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                            b.status === 'Declined' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' :
                            'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                          }`}>
                            {b.status}
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mb-3">Creator: <strong className="text-slate-200">{b.creatorName}</strong> • Rate: <strong className="text-white">${b.rate}</strong></p>
                        <p className="text-xs text-slate-300 bg-slate-950/60 p-3 rounded-xl border border-slate-800/60 leading-relaxed">
                          <strong className="text-slate-400 block mb-0.5">Project Brief:</strong> {b.notes}
                        </p>
                      </div>

                      {b.status === 'Declined' && (
                        <div className="mt-4 p-3.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300 space-y-2">
                          <div>The creator was unable to take this request. Payment authorization was released.</div>
                          <button 
                            onClick={() => setCurrentTab('marketplace')}
                            className="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg font-medium transition-all text-xs"
                          >
                            Explore Alternative Creators
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 5: USER PROFILE */}
            {currentTab === 'profile' && (
              <div className="max-w-xl mx-auto bg-slate-900/60 border border-slate-800/80 p-6 sm:p-8 rounded-2xl shadow-xl backdrop-blur-sm">
                <header className="mb-6 flex items-center space-x-5 border-b border-slate-800/80 pb-5">
                  <div className="relative group">
                    <img 
                      src={profileForm.avatarUrl} 
                      alt={profileForm.name} 
                      className="w-20 h-20 rounded-2xl object-cover border-2 border-indigo-500/50 shadow-xl shadow-indigo-500/10"
                    />
                    <div className="absolute inset-0 bg-slate-950/60 rounded-2xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-semibold text-white pointer-events-none">
                      Preview
                    </div>
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold text-white">{profileForm.name}</h1>
                    <p className="text-slate-400 text-xs">{profileForm.email}</p>
                    <span className="inline-block mt-2 text-[10px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-0.5 rounded-full">Active Creator</span>
                  </div>
                </header>

                {profileSaved && (
                  <div className="mb-5 p-3.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-xl flex items-center font-medium">
                    Profile successfully updated!
                  </div>
                )}

                <form onSubmit={handleUpdateProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Display Name</label>
                    <input 
                      type="text" 
                      required 
                      value={profileForm.name} 
                      onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white focus:border-indigo-500 focus:outline-none" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                    <input 
                      type="email" 
                      required 
                      value={profileForm.email} 
                      onChange={(e) => setProfileForm({ ...profileForm, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white focus:border-indigo-500 focus:outline-none" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Choose Avatar from Photo Gallery</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={handleGalleryImageUpload}
                      className="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer border border-slate-800 p-2 rounded-xl bg-slate-950" 
                    />
                  </div>

                  <div className="pt-2">
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all text-xs shadow-lg shadow-indigo-600/25">
                      Save Profile Changes
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* MODAL: BOOK A GIG */}
            {selectedGigForBooking && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                  <h2 className="text-lg font-bold text-white mb-1">Confirm Service Booking</h2>
                  <p className="text-xs text-slate-400 mb-4">Requesting order for <strong className="text-slate-200">"{selectedGigForBooking.title}"</strong> at <strong className="text-white">${selectedGigForBooking.rate}</strong></p>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleBookGig({
                      clientName: profile.name,
                      clientEmail: profile.email,
                      notes: formData.get('notes')
                    });
                  }} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Your Name</label>
                      <input name="clientName" value={profile.name} disabled readOnly type="text" className="w-full px-3 py-2 border border-slate-800 rounded-xl text-xs bg-slate-950 text-slate-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Your Email</label>
                      <input name="clientEmail" value={profile.email} disabled readOnly type="email" className="w-full px-3 py-2 border border-slate-800 rounded-xl text-xs bg-slate-950 text-slate-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Project Brief & Requirements</label>
                      <textarea name="notes" required rows="3" placeholder="Provide link to raw files, preferences, or channel links..." className="w-full px-3 py-2 border border-slate-800 rounded-xl text-xs bg-slate-950 text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none"></textarea>
                    </div>
                    <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                      <button 
                        type="button" 
                        onClick={() => setSelectedGigForBooking(null)}
                        className="px-4 py-2 text-xs text-slate-400 hover:text-white rounded-xl"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit"
                        className="px-4 py-2 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-md shadow-indigo-600/25"
                      >
                        Submit Order
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
